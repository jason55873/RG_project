{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "新增採購憑單" %}{% endblock %}

{% block content %}
<h2>{% trans "新增採購憑單" %}</h2>
<form id="purchase-form">
  <div class="mb-2">
    <label for="purchase_date">{% trans "採購日期" %}</label>
    <input type="date" id="purchase_date" name="purchase_date" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="voucher_number">{% trans "單據號碼" %}</label>
    <input type="text" id="voucher_number" name="voucher_number" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="status">{% trans "單況" %}</label>
    <select id="status" name="status" class="form-select">
      <option value="open">{% trans "未結案" %}</option>
      <option value="closed">{% trans "已結案" %}</option>
      <option value="invalid">{% trans "無效" %}</option>
    </select>
  </div>
  <div class="mb-2">
    <label for="currency">{% trans "幣別" %}</label>
    <input type="number" id="currency" name="currency" class="form-control" required>
    <!-- 實務上可用 select，這裡簡化為輸入ID -->
  </div>
  <div class="mb-2">
    <label for="supplier">{% trans "廠商" %}</label>
    <input type="number" id="supplier" name="supplier" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="supplier_address">{% trans "廠商地址" %}</label>
    <input type="number" id="supplier_address" name="supplier_address" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="purchaser">{% trans "採購人員" %}</label>
    <input type="number" id="purchaser" name="purchaser" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="creator">{% trans "製單人員" %}</label>
    <input type="number" id="creator" name="creator" class="form-control" required>
  </div>
  <div class="mb-2">
    <label for="reviewer">{% trans "覆核人員" %}</label>
    <input type="number" id="reviewer" name="reviewer" class="form-control" required>
  </div>
  <!-- 你可以依需求加入更多欄位 -->

  <button type="submit" class="btn btn-primary">{% trans "儲存" %}</button>
  <a href="{% url 'purchasevoucher_list' %}" class="btn btn-secondary">{% trans "返回" %}</a>
</form>

<script>
document.getElementById('purchase-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const data = {
    purchase_date: document.getElementById('purchase_date').value,
    voucher_number: document.getElementById('voucher_number').value,
    status: document.getElementById('status').value,
    currency: document.getElementById('currency').value,
    supplier: document.getElementById('supplier').value,
    supplier_address: document.getElementById('supplier_address').value,
    purchaser: document.getElementById('purchaser').value,
    creator: document.getElementById('creator').value,
    reviewer: document.getElementById('reviewer').value
  };
  fetch('/api/purchasevouchers/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrftoken
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(result => {
    if(result.id){
      alert('新增成功！');
      window.location.href = "{% url 'purchasevoucher_list' %}";
    }else{
      alert('新增失敗：' + JSON.stringify(result));
    }
  });
});
</script>
{% endblock %}
